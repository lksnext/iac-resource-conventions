name: Publish alpha to GitHub Packages

# Manual-only publication of the coordinated first-alpha release
# (@lksnext/iac-conventions-core, -catalog, -cli) to GitHub Packages
# (https://npm.pkg.github.com) — never registry.npmjs.org or a private Nexus
# registry. See docs/release-notes/publishing.md for the full runbook this
# automates, and IMPLEMENTATION.md#release-readiness for the rationale behind the
# gates below.
#
# This workflow only publishes; it never creates a Git tag or a GitHub Release —
# those are a separate, later step once this first GitHub Packages publication has
# been proven end-to-end (see docs/release-notes/publishing.md#sequence).

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "publish-alpha" to confirm publishing 0.1.0-alpha.1 to GitHub Packages'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-alpha
  cancel-in-progress: false

jobs:
  publish:
    name: Publish alpha packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Fail before checkout, before any dependency is installed, and before any
      # credential is configured, if either safety gate below does not hold.
      - name: Verify confirmation input
        if: ${{ github.event.inputs.confirmation != 'publish-alpha' }}
        run: |
          echo "::error::Confirmation input must be exactly 'publish-alpha'. Aborting before any publish action."
          exit 1

      - name: Verify triggered from main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow must be run against refs/heads/main, got '${{ github.ref }}'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@lksnext"

      - name: Install dependencies
        run: npm ci

      # Sections 10-13: synchronized versions, exact-pinned internal dependencies,
      # publishConfig.registry / repository-root .npmrc scope routing, and
      # repository metadata — all offline, no registry call.
      - name: Verify publish readiness
        id: readiness
        run: node scripts/verify-publish-readiness.mjs

      # The same aggregate gate CI runs on every push/PR (typecheck, Biome, docs
      # lint/spell, tests, build, Specification JSON validation) — see ci.yml.
      - name: Full validation
        run: npm run validate

      - name: Package dry run
        run: npm run package:dry-run

      # Local-tarball install/import/CLI smoke test — does not require GitHub
      # Packages authentication (installs with --offline from local tarballs, not
      # the registry). See scripts/smoke-test-packages.mjs.
      - name: Package smoke test (local tarballs)
        run: npm run package:smoke-test

      # Section 16: refuse to publish over an already-published version. Checked
      # for all three packages before the first `npm publish` runs.
      - name: Check GitHub Packages for existing versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for dir in packages/core packages/catalog packages/cli; do
            node scripts/github-packages-check.mjs "$dir" absent
          done

      - name: Publish core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --workspace=@lksnext/iac-conventions-core --registry https://npm.pkg.github.com --tag alpha

      - name: Verify core published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-packages-check.mjs packages/core present

      - name: Publish catalog
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --workspace=@lksnext/iac-conventions-catalog --registry https://npm.pkg.github.com --tag alpha

      - name: Verify catalog published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-packages-check.mjs packages/catalog present

      - name: Publish cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --workspace=@lksnext/iac-conventions-cli --registry https://npm.pkg.github.com --tag alpha

      - name: Verify cli published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-packages-check.mjs packages/cli present

      # Real consumer install from GitHub Packages itself (not local tarballs) —
      # proves the published package graph resolves entirely from
      # https://npm.pkg.github.com. See scripts/smoke-test-github-packages.mjs.
      - name: Post-publication registry smoke test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/smoke-test-github-packages.mjs

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Publish alpha to GitHub Packages"
            echo
            echo "- Version: \`${{ steps.readiness.outputs.version }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Registry: https://npm.pkg.github.com"
            echo "- Dist-tag: \`alpha\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
